        function pageInIframe() {
            return (window.location !== window.parent.location);

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");

            }

        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }

                }

## ¿Qué hace la cuantificación? 🔢

- Transforma fenómenos sociales en algo medible y verificable (cuantificable)
    
- [Representan](https://dle.rae.es/representaci%C3%B3n) experiencias humanas, nuestras elecciones y comportamientos (simplifica-sustituye la realidad, que es caótica).
- Ejemplos:
    - estadísticas de desempleo,        
    - tasas de mortandad,
    - cambios en los tipos de consumos,
    - cambios en la actividad económica,
    - desafíos para grupos sociales
    - ¿otros? ¿ideas? ¿qué se les ocurre?
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#F2E7BF" template="" -->

## ¿Para qué nos sirve medir? 🧰 📏 

- La cuantificación responde preguntas sobre:
    - Comparación (geográfica, social, histórica)
    - Estructuras sociales
    - Patrones de comportamiento
    - Impacto de decisiones políticas
    - Relaciones y vinculos sociales        
    - Demografía (características de una población)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->

3. Adaptar el _método científico_ a ejercicios concretos (proyectos y diseños de investigación)

## Comte y la "ciencia positiva" 🧑‍🔬

Objetivo: <mark>**Reconstruir el orden social** luego de la Revolución francesa y revolución industrial</mark>

<div style="background-color: rgba(5, 15, 15, 0.65); padding: 20px; border-radius: 10px;">
> "Tras la Revolución francesa, las concepciones metafísicas y teológicas del mundo habían perdido vigencia. A esa nueva ciencia comienza llamándola “física social”, por su equiparación a las ciencias de la naturaleza. Años después, en 1839, en el IV volumen de su obra Curso de filosofía positiva (Cours de Philosophie Positivistic, 1830-1842), aparece con la que sería su denominación definitiva: “sociología”. Quería diferenciarla de la “física social” descriptiva de Quételet y hacerla una disciplina teórica, que tuviese como objeto el descubrimiento de las leyes fundamentales inherentes a los fenómenos sociales”

> --  (Cea D'Ancona, 2012, p. 18)
</div>
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Postulados del positivismo ➕ ✅

1. Los fenómenos sociales han de analizarse desde un **punto de vista científico**
	1. A semejanza de los fenómenos naturales (observación objetiva)
	2. Minimizar la interpretación subjetiva
	3. Foco en aspectos observables y medibles de la realidad social.
	4. Sin prejuicios personales ni juicios de valor.
2. **Verificación empírica**
	1. Conocimiento basado en pruebas sensoriales.
	2. Lo observable importa más que lo teórico (especulativo)
	3. Hipótesis (proposiciones o conjeturas) que puedan comprobarse sistemáticamente.
	4. Basarse en datos empíricos en lugar de argumentos filosóficos o morales.
3. **Rigor** metodológico:
	1. Métodos de las ciencias naturales / técnicas cuantitativas.
	2. Herramientas de medición precisas y resultados replicables.
	3. Procedimientos estandarizados de investigación.
4. Ver los fenómenos como entrelazados y comprendidos en un todo.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#F2E7BF" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Funcionalismo 
- Durkheim define la sociedad: como una suma de hechos que han de analizarse como cosas. 
  > No porque los hechos sociales sean cosas materiales propiamente dichas, sino porque han de ser analizados como data, desde fuera, por su característica de observables y verificables empíricamente, a través del método científico. Lo cual exige:  • Desechar toda idea preconcebida. (Cea D'Ancona, 2012, p. 19)
- El funcionalismo se preocupa por comprender las instituciones, normas o reglas sociales y cómo sirven un propósito. 
- Medir fenómenos específicos, empírica y cuantitativamente, permite confrontar conjeturas y establecer regularidades, e implicancias teóricas (más allá de lo observado).
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## El _Suicidio_ como hecho social 🚢  👨‍✈
- El caso del Suicidio es un claro ejemplo:
 > “Ha sido la primera obra importante que ha configurado la tradición de la teoría social con la aritmética política (...). Fue el prototipo perfecto de informe de investigación moderna (...). La parte teórica está bastante desarrollada, ya que el interés teórico del autor supera el problema del suicidio en sí. Las teorías anteriores son examinadas detalladamente, y el marco de la investigación está claramente definido; el significado de las estadísticas de suicidios es estudiado en todas sus ramificaciones; las hipótesis son modificadas y mejoradas como consecuencia de las confrontaciones con los datos, y reciben una nueva formulación al final de la obra” (Caplow, 1977: 10).
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Weber: tipologías como medio 🏷
 
- Unión de fenómenos singulares, difusos, y discretos
- Importancia de la selección de los procesos y la relación de los mismos (no todo es observable, sino sujeto a interpretación)
- Pasos para adquirir el conocimiento: 
	1. Fijar conceptos y establecer regularidades.  
	2. Agrupar las causas posibles en cada caso y en el momento histórico determinado, señalando su importancia y a qué se debe.  
	3. Remontarnos al pasado para ofrecer una explicación histórica de las distintas particularidades de tales agrupaciones.  
	4. Evaluación de las posibles constelaciones de factores en el futuro 
	   (Weber, 1977: 41)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Dos Paradigmas: dos tipos de relaciones sociales ➡ ⬅

- **Estructural** (Sociedad o *Gesellschaft*): relaciones racionales, mercantiles y mecanicistas (Durkheim, Pareto, Merton, Parsons, Festinger, etc.)
	- Dimensión estructural
	- El método científico es común (movimiento entre ciencias)
	- Medición "objetiva" (externa)
	- Leyes generales, demostración de causalidades, y generalización de resultados de investigación
- **Intersubjetiva** (Comunidad o *Gemeinschaft*): relaciones afectivas, de sentimientos y emociones (Max Weber, Tönnies, Simmel, Teoría Crítica, Fenomenología, etc.)
	- Las ciencias sociales tienen métodos específicos
	- Análisis de lo individual y concreto (interpretando significados)
	- Importancia de los significados y sus intersubjetividad (punto de vista del actor)
	- Énfasis en el lenguaje y aspectos de interacción (micro)
	- Descripción y comprensión (en marcos de referencia de los actores)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->

## Conversemos 🗣

1. ¿Por qué creen que estos dos paradigmas contrastan? ¿Qué opiniones tienen al respecto?
2. ¿Qué tipos de recursos creen que se necesitaban (en los siglos XIX y XX) para estos dos tipos de investigación? ¿Cómo creen que eso influye en quién puede realizarlas, y aplicar sus resultados?
3. ¿Creen que esto se mantiene igual?
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#F2E7BF" template="" -->

### Contraste entre Paradigmas
#### Aspectos Epistemológicos y Metodológicos ⚙

| |PARADIGMA CUANTITATIVO|PARADIGMA CUALITATIVO|
|---|---|---|
|**Base epistemológica**|Positivismo, evolucionismo, funcionalismo, teoría de sistemas, neopositivismo...|Romanticismo, historicismo, escuela neokantiana, fenomenología, interaccionismo simbólico, etnometodología...|
|**Concepción de la ciencia**|Unidad de la ciencia: analogía metodológica de las ciencias sociales con las ciencias naturales|Diferenciación de las ciencias sociales de las naturales: singularidad de su objeto y método de conocimiento|
|**Objeto**|La cohesión estructural y la medición precisa y objetiva|La actividad intersubjetiva y procesos interactivos, dando relevancia a la condicionalidad histórica y su significado cultural|
|**Énfasis**|Búsqueda de regularidades objetivas de los fenómenos sociales: identificación de leyes universales y mediciones válidas y fiables|Análisis de lo individual y concreto. Énfasis en la variedad y especificidad de las sociedades humanas y de sus manifestaciones culturales|
|**Método**|Descripción y explicación de los hechos sociales como elementos integrantes de la sociedad global. Interesan los aspectos cuantitativos: medición objetiva, demostración de causalidad y generalización de los resultados de la investigación. Prevalencia del método deductivo (de la teoría a los datos)|Comprensión e interpretación de los agentes internos de la acción social. Destacan los aspectos cualitativos: descripción y comprensión de la conducta humana en su marco de referencia (individual y colectivo). Método inductivo (de los datos a la teoría)|
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Recopilación, Análisis y Alcance 📚

| |PARADIGMA CUANTITATIVO|PARADIGMA CUALITATIVO|
|---|---|---|
|**Recogida de información**|Estructurada y sistemática. Máximo control y uniformidad en la recogida de datos y análisis para favorecer la comparabilidad (objetividad y replicabilidad)|Flexible: un proceso interactivo continuo marcado por el desarrollo de la investigación (dificulta la replicación)|
|**Análisis**|Estadístico para cuantificar la realidad social, las relaciones causales y su intensidad. Datos en forma de números. Análisis enfocados a la inferencia estadística (precisa del muestreo probabilístico)|Interpretacional, sociolingüístico y semiológico de los discursos, acciones y estructuras latentes. Datos en forma de palabras e imágenes. No precisa del muestreo probabilístico, sino que los sujetos aporten información relevante|
|**Alcance de los resultados**|Nomotética: búsqueda cuantitativa de leyes generales de la conducta|Ideográfica: búsqueda cualitativa de significados de la acción humana|
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#1C7C54" template="" -->

- **Teorías**: Marco conceptual explicativo

### Hipótesis ✍ ❓

> Las hipótesis son **respuestas probables a interrogantes del investigador**, formuladas a partir del conocimiento previo y destinadas a su contrastación empírica.

1. Se formulan para la contrastación empírica.
2. La teoría (en un campo o disciplina) busca explicar la realidad y/o predecirla (en un rango de probabilidades).
3. Una teoría se compone de la formulación y verificación de distingas hipótesis.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### "El Suicidio" E. Durkheim (I) 🚢 👨‍✈

1. Hipótesis para contrastación empírica:
- Hipótesis: "A mayor integración social, menor tasa de suicidios"
- Contrastación: Análisis de tasas de suicidio en diferentes comunidades 
	- Variable independiente: **Nivel** de integración social (estado civil, pertenencia religiosa, densidad de vínculos sociales)
	- Variable dependiente: **Número** de suicidios
- Medición: **registros de suicidios** (certificados de defunción, informes policiales, registros judiciales, archivos hospitalarios, etc.)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### "El Suicidio" E. Durkheim (II) 🚢 👨‍✈
1. Teoría que explica/predice la realidad:
- Explicación: *el suicidio no es un acto individual, sino un fenómeno social*
- Predicción: en sociedades con *baja cohesión social (anomia), aumentarán los suicidios*
- Probabilidad: no todos los individuos en situación de anomia se suicidarán, pero *la probabilidad será mayor*
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### "El Suicidio" E. Durkheim (III) 🚢 👨‍✈

- Ejemplos de múltiples hipótesis
	- Hipótesis 1: Los católicos tienen menor tasa de suicidio que los protestantes
	- Hipótesis 2: Los hombres solteros se suicidan más que los casados
	- Hipótesis 3: La integración familiar reduce el riesgo de suicidios
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->

- **Deducción**🔻: De lo general a lo particular. De la teoría a hipótesis específicas
- **Operacionalización** 📏 : Convertir conceptos en variables medibles. Precisión 
- **Interpretación** 🤔 : Análisis de los datos recolectados, identificación de regularidades. 
- **Inducción** 🔺: De lo particular a lo general. Extracción de conclusiones generales a partir de lo observado.

Documento que estructura sistemáticamente una investigación, estableciendo sus fundamentos, metodología, recursos y condiciones de realización.

**Componentes Centrales**:

- Formulación del problema
- Operacionalización de los conceptos
- Factibilidad (económica, organizativa, temporal)
- Relevancia

**Condicionantes**: objetivos, recursos disponibles y tiempo determinan el alcance y desarrollo de la investigación.
