## Escala diferencial de Thurstone ⚖️

Procedimiento para medir actitudes mediante aseveraciones evaluadas por jueces.

- La escala incluye una serie de proposiciones (favorables o contrarias) relativas a una determinada actitud, expresadas de manera categórica (como aseveraciones)
- De cada una se pide que se indique si se está de acuerdo o en desacuerdo
- El promedio de las respuestas resume la actitud hacia el objeto de estudio
- Únicamente mide el acuerdo o el desacuerdo, **no la intensidad** del acuerdo y el desacuerdo
- La laboriosidad que exige su elaboración explica su **uso limitado** en la investigación social

Ver en Cea D'Ancona (2012, pp. 96-98)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Thurstone: pasos para construir la escala ⚖️

1. **Determinar** la actitud a medir
2. **Generar** un número elevado de ítems (de 100 a 150), que han de cubrir el continuo de la actitud: desde el extremo más positivo hasta el más negativo
3. **Prueba de jueces**: un grupo de expertos (preferiblemente ≥ 30) clasifica cada ítem en uno de los 11 montones del continuo: desde "bastante desfavorable" (1) hasta "bastante favorable" (11), siendo el "6" el valor neutro
4. **Seleccionar** y listar de forma aleatoria los 20 o 30 ítems finalmente seleccionados para aplicarse a la muestra de estudio
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Thurstone: ejemplo ⚖️

_Escala de actitudes raciales (Srole, en García Ferrando, 1971):_

| Valor escalar | Ítem | Respuesta |
|---|---|---|
| 10,3 | Creo que el negro tiene los mismos derechos sociales que el blanco | De acuerdo / En desacuerdo |
| 10,3 | El negro debería ser considerado como igual al hombre blanco y disfrutar de sus mismas ventajas | De acuerdo / En desacuerdo |
| 7,7 | El negro es perfectamente capaz de cuidar de sí mismo, si el hombre blanco le deja tranquilo | De acuerdo / En desacuerdo |
| 5,4 | No me interesa en absoluto la situación social del negro | De acuerdo / En desacuerdo |
| 2,7 | En ningún caso los niños negros deberían asistir a la misma escuela que los niños blancos | De acuerdo / En desacuerdo |
| 0,9 | El negro está siempre un poco por encima de los animales | De acuerdo / En desacuerdo |
| 0,9 | El negro debería ocupar el lugar más bajo entre los seres humanos | De acuerdo / En desacuerdo |

>Nota: el valor escalar resulta del promedio de los jueces evaluando cada ítem (1 es "bastante desfavorable" y 11 es "bastante favorable") por eso es usa para ordenar las actitudes.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Escala acumulativa de Guttman 🔢

> "Procedimiento escalar acumulativo para medir actitudes. En él los ítems se ordenan de tal manera que la respuesta positiva a uno de ellos suponga también acuerdo con los ítems de orden de rango inferior (que se sitúan debajo de él)."

Diferencias con Thurstone:
- Se reducen los ítems (≥ 30 para seleccionar los definitivos)
- Se elimina la prueba de jueces → se reemplaza por **prueba piloto**

Las categorías de respuesta pueden ser:
- **Dicotómicas**: "de acuerdo" (1) / "en desacuerdo" (0)
- **Politómicas**: como en Likert → la puntuación más elevada se asigna al valor más favorable a la actitud

Ver en Cea D'Ancona (2012, pp. 98-101)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Guttman: la lógica del error 🔢

La clave de esta escala es **validar** sus resultados identificando los errores en los valores.

Si una persona responde afirmativamente a un ítem de cierta dificultad, debería responder también afirmativamente a todos los ítems de menor dificultad.

Un **error** ocurre cuando esa cadena se rompe: la respuesta observada no coincide con la respuesta que el modelo predice para esa persona en ese ítem.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Guttman: ejemplo 1 🔢

_Escala de aspiraciones de los padres hacia el logro educativo de sus hijos:_

| Ítem | Respuesta |
|---|---|
| Lograr éxito es sólo una forma de que mis hijos compensen mis esfuerzos como padre | De acuerdo / En desacuerdo |
| Ir a un buen colegio y obtener un buen trabajo son importantes, pero no esenciales en la felicidad de mis hijos | De acuerdo / En desacuerdo |
| La felicidad nada tiene que ver con lograr metas educativas o materiales | De acuerdo / En desacuerdo |
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->

_Dominio de técnicas e instrumentos de diagnóstico (estudiantes universitarios)_

Ayuda a diferenciar entre niveles de **"principiante"**, **"iniciado"** y **"experto"** para la autoselección de actividades de aprendizaje.

| Ítem | Sí | No |
|---|---|---|

| Usted sabe aplicar esta técnica de diagnóstico en un caso o situación concreta | 1 | 0 |
| Usted puede identificar y explicar los elementos/pasos fundamentales que la componen | 1 | 0 |
| Usted puede elaborar un material educativo sobre su naturaleza y uso en educación | 1 | 0 |
| Usted conoce las teorías que fundamentan su aplicación en el campo educativo | 1 | 0 |
| Usted podría formar al profesorado o a técnicos sobre el uso de esa técnica en educación | 1 | 0 |
| Usted puede plantear argumentaciones técnicas y científicas sobre su uso en educación | 1 | 0 |
| Usted conoce las líneas de investigación y los últimos avances sobre los enfoques y teorías científicas que fundamentan esta técnica | 1 | 0 |
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->

## Escala aditiva de Likert ➕

Viene de la psicología y mide actitudes.

- Propone menos ítems que Thurstone: ~60 para quedarse con ~25
- Las aseveraciones **no deben ser "muy suaves"** porque facilitan acuerdos y no permiten medir
- **Escala politómica** (opuesto a dicotómica):
  - **5 opciones**: facilitar a quien responde encontrar el matiz deseado
  - **4 a 9 opciones**: más cantidad da fiabilidad en estudios longitudinales
  - Los **números impares** permiten punto medio
- La prueba se aplica a una **muestra representativa**

> "La información que aporten se utilizará para seleccionar los ítems finalmente a incluir en la escala definitiva: los menos ambiguos y más discriminantes para medir la actitud." (Cea D'Ancona, 2012, p. 102)

Ver en Cea D'Ancona (2012, pp. 102-109)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Likert: ejemplo de ítems ➕

_Actitud frente a la inmigración en España:_

| Ítem | Muy de acuerdo | De acuerdo | Indiferente | En desacuerdo | Muy en desacuerdo |
|---|---|---|---|---|---|
| Los inmigrantes legalmente establecidos en España deberían tener los mismos derechos sociales que los españoles | 5 | 4 | 3 | 2 | 1 |
| Todos los inmigrantes, formales o irregulares, deberían ser repatriados a sus países de origen | 1 | 2 | 3 | 4 | 5 |

> La dirección de la puntuación se invierte entre ambos ítems, reflejando que el primero es favorable y el segundo desfavorable hacia la actitud medida.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Cómo se prueba la escala de Likert 

> "Los sujetos se ordenan en orden decreciente, de acuerdo con su puntuación total. Con el 25% de los sujetos con puntuaciones más elevadas (grupo alto) y el 25% con las más bajas (grupo bajo), se analiza la adecuación de cada ítem para medir la actitud." (Cea D'Ancona, 2012, p. 104)

Para cada ítem se calcula:

- **Media** en ambos grupos + desviación típica → prueba *t* de Student (nivel de significación: 0,05). Los ítems con valor *t* empírico inferior al teórico se descartan por **no discriminantes**
- **Coeficiente de correlación** de cada ítem con el total → se eligen los que presenten correlación > 0,35
- **Mediana** de cada ítem en ambos grupos → tabla de contingencia (2 filas × 2 columnas: grupo alto/bajo)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->

## Diferencial semántico de Osgood 🔀

> "Muestra gran utilidad para la medición de estereotipos y, en general, de actitudes hacia diferentes grupos sociales." (Cea D'Ancona, 2012, p. 109)

- Los ítems son **pares de adjetivos** que expresan dimensiones del concepto a medir
- Pueden ser **bipolares** (amigable–hostil) o **unipolares** (amigable–no amigable): estos últimos indican la existencia o ausencia de un único atributo
- Los pares se alternan de forma **aleatoria**, para que las respuestas positivas (o negativas) no caigan siempre en el mismo extremo

Ver en Cea D'Ancona (2012, pp. 109-111)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->

## Puntos en común entre las escalas 🔗

- Necesitamos **más ítems** de los que finalmente hemos de aplicar
- Necesitamos un **proceso de selección** (prueba) de los ítems — los instrumentos que usamos para registrar respuestas
- Debemos tener una **lógica general** que articule los ítems entre sí
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->

## Comparación de escalas 

||Bogardus|Thurstone|Guttman|Likert|Osgood|
|---|---|---|---|---|---|
|**Lógica**|Acumulativa|Diferencial|Acumulativa|Aditiva|Semántica|
|**Qué mide**|Distancia social|Actitudes|Actitudes|Actitudes|Estereotipos y actitudes hacia grupos|
|**Nº de ítems**|—|100-150 → 20-30|≥ 30|~60 → ~25|31 pares → selección final|
|**Prueba de ítems**|Pesos asignados por punto|Jueces (≥ 30)|Prueba piloto|Muestra representativa|Prueba piloto|
|**Tipo de respuesta**|Dicotómica|Dicotómica|Dicotómica o politómica|Politómica (4-9 opciones)|Escala 1-7|
|**Tipo de ítem**|Proposiciones ordenadas|Aseveraciones|Proposiciones ordenadas|Aseveraciones|Pares de adjetivos bipolares|
|**Mide intensidad**|No|No|No|Sí|Sí|
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#1C7C54" template="" -->

## Parte 2: Cuestionario 📋

El cuestionario tiene que tener entre **8 y 12 preguntas** organizadas en tres partes:

| Parte | Qué incluye | Cuántas |
|---|---|---|

2. No podemos medirla de golpe. Hay que hacerlo **por partes**: cada pregunta tiene que atender una dimensión específica de la variable.

3. <mark>Si no desagregamos la variable, no la estamos midiendo correctamente</mark> — solo la estamos nombrando.

<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## ¿Por qué no podemos preguntar a toda.o.s? 🤔

- Imagina que quieres saber qué tan satisfechos están los estudiantes de tu universidad con los servicios escolares.
- ¿Le preguntarías a los **61.000 estudiantes** de la UAM?
- Hay limitaciones reales: **tiempo, dinero, logística**
- La solución no es renunciar a la generalización — es **seleccionar bien**

> "Se puede extraer información de una muestra relativamente pequeña de la población, sin necesidad de proceder a un censo completo" — Cea D'Ancona, 2012

- Esta selección tiene reglas: esto es el muestreo.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Unidades de observación 🔍 🔬

- Son las **unidades sobre las que recaerá la medición** en nuestro estudio
- Pueden ser: personas, familias, viviendas, escuelas, organizaciones, eventos, etc.
- La pregunta de investigación y los objetivos del estudio **determinan cuáles son**
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Unidades de observación🔬


- Ejemplo: si estudiamos ausentismo escolar → la unidad de observación son los **estudiantes**, no las escuelas
- ¿Cuáles son las unidades de observación en su proyecto?
	- ¿Sobre quién o qué estamos preguntando?
- Una vez que sabemos qué unidades nos interesan, la pregunta es: ¿a cuántas y a cuáles les preguntamos?
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Muestra representativa 📐

- Una muestra es una **parte de la población** de la que extraemos información
- Para que sea válida, tiene que ser **representativa**: una versión a pequeña escala de la población
- Eso exige que la selección siga algún **procedimiento que garantice esa representatividad**
- De la calidad de esa selección dependen las **posibilidades de generalizar** los resultados

> "De cómo sea su materialización dependerá la calidad de la información que se recoja: las posibilidades de generalización de los resultados del estudio" — Cea D'Ancona, 2012
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Una muestra no lo es todo

- Una buena muestra no es garantía
- Se puede diseñar una muestra perfecta en papel y aun así obtener resultados distorsionados
- **¿Por qué?** Porque si las unidades seleccionadas **no terminan participando**, la foto que obtenemos no es fiel a la realidad
- El <mark>diseño es una cosa. La **ejecución** es otra.</mark> 
- Por eso el diseño muestral importa: no como garantía absoluta, sino como el mejor punto de partida posible.

> "Se puede haber proyectado una buena muestra, si al final no se consigue que participen las unidades seleccionadas, se puede acabar ofreciendo una fotografía distorsionada de la realidad" — Cea D'Ancona, 2012
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Diseño muestral 🗺️

Diseñar una muestra implica tomar tres decisiones:

1. Definir la **población** (o universo de estudio)
2. Determinar el **tamaño** de la muestra
3. Elegir el **procedimiento** para seleccionarla
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## La población de estudio 👥

- Es el **conjunto de unidades sobre las que queremos obtener información**
- La pregunta de investigación y los objetivos del estudio **determinan la población a analizar**
- Hace falta **delimitar** la población es hacerla **explícita**: quién entra y quién no
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Delimitando la población ✂

- Como con la operacionalización, delimitar es desagregar: no basta con decir "jóvenes universitarios" — hay que especificar qué significa eso en términos concretos.

| Dimensión        | Pregunta que responde | Ejemplo                    |
| ---------------- | --------------------- | -------------------------- |
| Unidades         | ¿Quiénes o qué?       | Estudiantes universitarios |
| Características  | ¿Con qué perfil?      | De entre 18 y 25 años      |
| Espacio y tiempo | ¿Dónde y cuándo?      | En la UAM, en 2025         |

- Nota: _Sin una población bien delimitada, no vamos a poder evaluar si nuestra muestra la representa correctamente_
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## El marco muestral 📋

- El marco es el intento de **listar todo el universo**: la traducción operativa de la población en unidades concretas y localizables,
- Un **registro** que incluye a las unidades de la población y que usamos para extraer la muestra
- Puede ser: un padrón, un censo, un registro de estudiantes, de pacientes, de empresas, etc.
- Del marco se espera que sea un **descriptor válido** de la población de estudio
- Diferencias:
	- **Población** → definición conceptual: quién entra y quién no
	- **Marco muestral** → su traducción operativa: el listado real de todas esas unidades
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Requisitos del marco muestral ✅

Para que el marco sea válido tiene que cumplir con:

- **Completitud** → debe incluir a todas las unidades de la población — solo puede representar a quien está en el listado
- **Actualización** → un marco desactualizado distorsiona la muestra — hay que conocer cuándo fue su última actualización
- **Igual presencia** → cada unidad debe tener la misma probabilidad de ser seleccionada
- **Exclusividad** → no debe incluir unidades que no pertenezcan a la población de estudio
- **Localizable** → debe contener información suficiente para contactar a las unidades seleccionadas

> Caso real: en las elecciones de EE.UU. de 1948, se usó un censo de 1940. Para entonces la población había cambiado radicalmente por la Segunda Guerra Mundial — eso sesgó sus predicciones y predijo un resutlado incorrecto.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Algunos ejemplos ☝

- Estudias satisfacción estudiantil en la UAM → el marco es el **padrón de estudiantes inscritos**
- Estudias hábitos de lectura en adultos mayores → el marco podría ser el **registro de una biblioteca o centro comunitario**
- Estudias condiciones laborales de enfermeras → el marco es el **registro del personal de un hospital o red de hospitales**
- Estudias participación electoral de jóvenes → el marco es el **padrón electoral del INE**
- Estudias consumo cultural en la CDMX → el marco podría ser el **directorio de usuarios de una plataforma de streaming o tarjeta de transporte**

> ¿Cuál dirías que es el marco muestral de tu proyecto?
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Selección aleatoria 🎲

- Ya tenemos el marco: sabemos quién está en el universo. Ahora hay que decidir **cómo elegimos** de ese listado.
- Lo aleatorio no significa descuidado — significa que **ninguna unidad tiene más probabilidad que otra de ser elegida**
- Es justamente eso lo que garantiza la representatividad de la muestra
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Selección aleatoria 🎡
- Los griegos tenían una diosa para esto: **[Tique](https://es.wikipedia.org/wiki/Fortuna_(mitolog%C3%ADa))**, la diosa de la fortuna. 
	- Sus decisiones no se podían predecir ni controlar. De eso se trata lo aleatorio.

- En el muestreo probabilístico, **el azar es el garante**: 
	Asegura que todos los integrantes de la población tengan igual probabilidad de ser seleccionados.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Tamaño de la muestra 📏 

No hay una respuesta única — el tamaño depende de varios factores:

- **Tiempo y recursos disponibles** → una encuesta cara a cara cuesta más que una telefónica o en línea — eso acota el tamaño posible
- **Análisis previstos** → cuanto más se segmente la muestra, mayor tamaño se necesita para que los resultados tengan validez estadística
- **Heterogeneidad de la población** → a mayor diversidad interna en la población, mayor tamaño de muestra para capturarla
- **Margen de error admisible** → a mayor error tolerado, menor tamaño de muestra necesario
- **Nivel de confianza** → a mayor certeza que se quiera tener en las estimaciones, mayor tamaño de muestra

Nota: No se trata de tener la muestra más grande posible — se trata de tener una lo **suficientemente grande** para alcanzar los objetivos del estudio.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Tamaño de muestra: una decisión de balance ⚖️

- Una muestra demasiado pequeña → resultados poco confiables, difícil generalizar
- Una muestra demasiado grande → costos innecesarios, sin ganancia real en precisión
- El tamaño óptimo es el que responde a los objetivos **con los recursos disponibles**

> ¿Qué factores creen que van a pesar más en su proyecto?
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Tipos de muestreo 🧭

- No todos los muestreos funcionan igual ni sirven para lo mismo
- La distinción clave es si la selección se basa en el **azar** o en algún **criterio del investigador**

|                              | **Probabilístico**     | **No probabilístico**               |
| ---------------------------- | ---------------------- | ----------------------------------- |
| **Selección**                | Aleatoria              | Por criterio, conveniencia o juicio |
| **Representatividad**        | Garantizada            | No garantizada                      |
| **Error muestral**           | Calculable             | Difícil de estimar                  |
| **Tamaño de muestra**        | Mayor                  | Menor                               |
| **Uso típico** *(objetivos)* | Inferencia estadística | Exploración, estudios cualitativos  |
*Inferencia estadística*: sacar conclusiones sobre toda la población a partir de los datos de la muestra
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Muestreo probabilístico (tipos) 🎲

- **Aleatorio simple** → se selecciona directamente del marco muestral (como una lotería)
- **Sistemático** → se selecciona cada n-ésimo elemento de la lista
- **Estratificado** → se divide la población en subgrupos y se muestrea dentro de cada uno
- **Por conglomerados** → se muestrea por grupos naturales: escuelas, colonias, hospitales

> La estratificación garantiza que todos los subgrupos relevantes de la población estén representados en la muestra
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Estratificación 🗂️

- Dividir la población en subgrupos homogéneos — **estratos** — antes de seleccionar la muestra
- Garantiza que todos los subgrupos relevantes queden **representados proporcionalmente**
- Sin estratificación, el azar puede dejar a algunos grupos sub o sobrerrepresentados
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Ejemplo de estratificación

- Estudiar satisfacción estudiantil en la UAM.
	- Tu población tiene estudiantes de cinco divisiones: CBS, CBI, CSH, CAD y CyAD.

- Sin estratificar → por azar podrías terminar con 80% de CSH y casi nadie de CyAD
- Estratificando → muestreas dentro de cada división y todas quedan representadas proporcionalmente
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Muestreo no probabilístico (ejemplos)

- **Por cuotas** → seleccionas perfiles específicos hasta completar un número
- **Bola de nieve** → un participante te lleva al siguiente
- **Por conveniencia** → seleccionas a quienes tienes más a la mano

> Piensen en su proyecto: ¿están buscando generalizar o explorar? ¿Tienen acceso a un marco muestral?
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## ¿Cuál usar? 💭

No es una pregunta de cuál es mejor — es una pregunta de **para qué sirve cada uno**

- **Probabilístico** → cuando quieres generalizar tus resultados a toda la población y tienes acceso a un marco muestral
- **No probabilístico** → cuando quieres explorar, profundizar, o tu población no tiene un registro accesible
- La elección del tipo de muestreo es el final del diseño (veamos como encajac on el resto)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Muestreo: ¿qué hace falta? ☑

1. Definir nuestra **población** — quién entra y quién no
2. Construir un **marco muestral** — listar el universo
3. Decidir cómo **seleccionamos** — azar o criterio
4. Elegir el **tipo de muestreo** que responda a nuestros objetivos
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

    <script>
        function extend() {
            const target = {};
            for (let i = 0; i < arguments.length; i++) {
                const source = arguments[i];
                for (const key in source) {
                    if (source.hasOwnProperty(key)) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        function isLight(color) {
            let hex = color.replace('#', '');

            // convert #fff => #ffffff
            if (hex.length == 3) {
                hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
            }

            const c_r = parseInt(hex.substr(0, 2), 16);
            const c_g = parseInt(hex.substr(2, 2), 16);
            const c_b = parseInt(hex.substr(4, 2), 16);
            const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
            return brightness > 155;
        }

        const bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();

        if (isLight(bgColor)) {
            document.body.classList.add('has-light-background');
        } else {
            document.body.classList.add('has-dark-background');
        }

        // default options to init reveal.js
        const defaultOptions = {
            controls: true,
            progress: true,
            history: true,
            center: true,
            transition: 'default', // none/fade/slide/convex/concave/zoom

                ElapsedTimeBar

            mathjax3: {

            },
            markdown: {
                gfm: true,
                mangle: false,
                pedantic: false,
                smartLists: false,
                smartypants: false,
            },
            mermaid: {
                theme: isLight(bgColor) ? 'default' : 'dark',
            },
            customcontrols: {
                controls: [
                    {
                        id: 'toggle-overview',
                        title: 'Toggle overview (O)',
                        icon: '<i class="fa fa-th"></i>',
                        action: 'Reveal.toggleOverview();'
                    },
                ]
            },
        };

        if ( pageInIframe() ) {
            defaultOptions.scrollActivationWidth = 5;
        }

        // options from URL query string
        const queryOptions = Reveal().getQueryHash() || {};

    </script>
