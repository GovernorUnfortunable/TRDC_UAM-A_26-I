        function pageInIframe() {
            return (window.location !== window.parent.location);

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");

            }

        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }

                    }, 250);
                }

## ¿Qué hace la cuantificación? 🔢

- Transforma fenómenos sociales en algo medible y verificable (cuantificable)
    
- [Representan](https://dle.rae.es/representaci%C3%B3n) experiencias humanas, nuestras elecciones y comportamientos (simplifica-sustituye la realidad, que es caótica).
- Ejemplos:
    - estadísticas de desempleo,        
    - tasas de mortandad,
    - cambios en los tipos de consumos,
    - cambios en la actividad económica,
    - desafíos para grupos sociales
    - ¿otros? ¿ideas? ¿qué se les ocurre?
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#F2E7BF" template="" -->

## ¿Para qué nos sirve medir? 🧰 📏 

- La cuantificación responde preguntas sobre:
    - Comparación (geográfica, social, histórica)
    - Estructuras sociales
    - Patrones de comportamiento
    - Impacto de decisiones políticas
    - Relaciones y vinculos sociales        
    - Demografía (características de una población)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->

3. Adaptar el _método científico_ a ejercicios concretos (proyectos y diseños de investigación)

## Comte y la "ciencia positiva" 🧑‍🔬

Objetivo: <mark>**Reconstruir el orden social** luego de la Revolución francesa y revolución industrial</mark>

<div style="background-color: rgba(5, 15, 15, 0.65); padding: 20px; border-radius: 10px;">
> "Tras la Revolución francesa, las concepciones metafísicas y teológicas del mundo habían perdido vigencia. A esa nueva ciencia comienza llamándola “física social”, por su equiparación a las ciencias de la naturaleza. Años después, en 1839, en el IV volumen de su obra Curso de filosofía positiva (Cours de Philosophie Positivistic, 1830-1842), aparece con la que sería su denominación definitiva: “sociología”. Quería diferenciarla de la “física social” descriptiva de Quételet y hacerla una disciplina teórica, que tuviese como objeto el descubrimiento de las leyes fundamentales inherentes a los fenómenos sociales”

> --  (Cea D'Ancona, 2012, p. 18)
</div>
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Postulados del positivismo ➕ ✅

1. Los fenómenos sociales han de analizarse desde un **punto de vista científico**
	1. A semejanza de los fenómenos naturales (observación objetiva)
	2. Minimizar la interpretación subjetiva
	3. Foco en aspectos observables y medibles de la realidad social.
	4. Sin prejuicios personales ni juicios de valor.
2. **Verificación empírica**
	1. Conocimiento basado en pruebas sensoriales.
	2. Lo observable importa más que lo teórico (especulativo)
	3. Hipótesis (proposiciones o conjeturas) que puedan comprobarse sistemáticamente.
	4. Basarse en datos empíricos en lugar de argumentos filosóficos o morales.
3. **Rigor** metodológico:
	1. Métodos de las ciencias naturales / técnicas cuantitativas.
	2. Herramientas de medición precisas y resultados replicables.
	3. Procedimientos estandarizados de investigación.
4. Ver los fenómenos como entrelazados y comprendidos en un todo.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#F2E7BF" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Funcionalismo 
- Durkheim define la sociedad: como una suma de hechos que han de analizarse como cosas. 
  > No porque los hechos sociales sean cosas materiales propiamente dichas, sino porque han de ser analizados como data, desde fuera, por su característica de observables y verificables empíricamente, a través del método científico. Lo cual exige:  • Desechar toda idea preconcebida. (Cea D'Ancona, 2012, p. 19)
- El funcionalismo se preocupa por comprender las instituciones, normas o reglas sociales y cómo sirven un propósito. 
- Medir fenómenos específicos, empírica y cuantitativamente, permite confrontar conjeturas y establecer regularidades, e implicancias teóricas (más allá de lo observado).
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## El _Suicidio_ como hecho social 🚢  👨‍✈
- El caso del Suicidio es un claro ejemplo:
 > “Ha sido la primera obra importante que ha configurado la tradición de la teoría social con la aritmética política (...). Fue el prototipo perfecto de informe de investigación moderna (...). La parte teórica está bastante desarrollada, ya que el interés teórico del autor supera el problema del suicidio en sí. Las teorías anteriores son examinadas detalladamente, y el marco de la investigación está claramente definido; el significado de las estadísticas de suicidios es estudiado en todas sus ramificaciones; las hipótesis son modificadas y mejoradas como consecuencia de las confrontaciones con los datos, y reciben una nueva formulación al final de la obra” (Caplow, 1977: 10).
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Weber: tipologías como medio 🏷
 
- Unión de fenómenos singulares, difusos, y discretos
- Importancia de la selección de los procesos y la relación de los mismos (no todo es observable, sino sujeto a interpretación)
- Pasos para adquirir el conocimiento: 
	1. Fijar conceptos y establecer regularidades.  
	2. Agrupar las causas posibles en cada caso y en el momento histórico determinado, señalando su importancia y a qué se debe.  
	3. Remontarnos al pasado para ofrecer una explicación histórica de las distintas particularidades de tales agrupaciones.  
	4. Evaluación de las posibles constelaciones de factores en el futuro 
	   (Weber, 1977: 41)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Dos Paradigmas: dos tipos de relaciones sociales ➡ ⬅

- **Estructural** (Sociedad o *Gesellschaft*): relaciones racionales, mercantiles y mecanicistas (Durkheim, Pareto, Merton, Parsons, Festinger, etc.)
	- Dimensión estructural
	- El método científico es común (movimiento entre ciencias)
	- Medición "objetiva" (externa)
	- Leyes generales, demostración de causalidades, y generalización de resultados de investigación
- **Intersubjetiva** (Comunidad o *Gemeinschaft*): relaciones afectivas, de sentimientos y emociones (Max Weber, Tönnies, Simmel, Teoría Crítica, Fenomenología, etc.)
	- Las ciencias sociales tienen métodos específicos
	- Análisis de lo individual y concreto (interpretando significados)
	- Importancia de los significados y sus intersubjetividad (punto de vista del actor)
	- Énfasis en el lenguaje y aspectos de interacción (micro)
	- Descripción y comprensión (en marcos de referencia de los actores)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->

## Conversemos 🗣

1. ¿Por qué creen que estos dos paradigmas contrastan? ¿Qué opiniones tienen al respecto?
2. ¿Qué tipos de recursos creen que se necesitaban (en los siglos XIX y XX) para estos dos tipos de investigación? ¿Cómo creen que eso influye en quién puede realizarlas, y aplicar sus resultados?
3. ¿Creen que esto se mantiene igual?
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" data-background-color="#F2E7BF" template="" -->

### Contraste entre Paradigmas
#### Aspectos Epistemológicos y Metodológicos ⚙

| |PARADIGMA CUANTITATIVO|PARADIGMA CUALITATIVO|
|---|---|---|
|**Base epistemológica**|Positivismo, evolucionismo, funcionalismo, teoría de sistemas, neopositivismo...|Romanticismo, historicismo, escuela neokantiana, fenomenología, interaccionismo simbólico, etnometodología...|
|**Concepción de la ciencia**|Unidad de la ciencia: analogía metodológica de las ciencias sociales con las ciencias naturales|Diferenciación de las ciencias sociales de las naturales: singularidad de su objeto y método de conocimiento|
|**Objeto**|La cohesión estructural y la medición precisa y objetiva|La actividad intersubjetiva y procesos interactivos, dando relevancia a la condicionalidad histórica y su significado cultural|
|**Énfasis**|Búsqueda de regularidades objetivas de los fenómenos sociales: identificación de leyes universales y mediciones válidas y fiables|Análisis de lo individual y concreto. Énfasis en la variedad y especificidad de las sociedades humanas y de sus manifestaciones culturales|
|**Método**|Descripción y explicación de los hechos sociales como elementos integrantes de la sociedad global. Interesan los aspectos cuantitativos: medición objetiva, demostración de causalidad y generalización de los resultados de la investigación. Prevalencia del método deductivo (de la teoría a los datos)|Comprensión e interpretación de los agentes internos de la acción social. Destacan los aspectos cualitativos: descripción y comprensión de la conducta humana en su marco de referencia (individual y colectivo). Método inductivo (de los datos a la teoría)|
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Recopilación, Análisis y Alcance 📚

| |PARADIGMA CUANTITATIVO|PARADIGMA CUALITATIVO|
|---|---|---|
|**Recogida de información**|Estructurada y sistemática. Máximo control y uniformidad en la recogida de datos y análisis para favorecer la comparabilidad (objetividad y replicabilidad)|Flexible: un proceso interactivo continuo marcado por el desarrollo de la investigación (dificulta la replicación)|
|**Análisis**|Estadístico para cuantificar la realidad social, las relaciones causales y su intensidad. Datos en forma de números. Análisis enfocados a la inferencia estadística (precisa del muestreo probabilístico)|Interpretacional, sociolingüístico y semiológico de los discursos, acciones y estructuras latentes. Datos en forma de palabras e imágenes. No precisa del muestreo probabilístico, sino que los sujetos aporten información relevante|
|**Alcance de los resultados**|Nomotética: búsqueda cuantitativa de leyes generales de la conducta|Ideográfica: búsqueda cualitativa de significados de la acción humana|
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#1C7C54" template="" -->

### Hipótesis ✍ ❓

> Las hipótesis son **respuestas probables a interrogantes del investigador**, formuladas a partir del conocimiento previo y destinadas a su contrastación empírica.

1. Se formulan para la contrastación empírica.
2. La teoría (en un campo o disciplina) busca explicar la realidad y/o predecirla (en un rango de probabilidades).
3. Una teoría se compone de la formulación y verificación de distingas hipótesis.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### "El Suicidio" E. Durkheim (I) 🚢 👨‍✈

1. Hipótesis para contrastación empírica:
- Hipótesis: "A mayor integración social, menor tasa de suicidios"
- Contrastación: Análisis de tasas de suicidio en diferentes comunidades 
	- Variable independiente: **Nivel** de integración social (estado civil, pertenencia religiosa, densidad de vínculos sociales)
	- Variable dependiente: **Número** de suicidios
- Medición: **registros de suicidios** (certificados de defunción, informes policiales, registros judiciales, archivos hospitalarios, etc.)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### "El Suicidio" E. Durkheim (II) 🚢 👨‍✈
1. Teoría que explica/predice la realidad:
- Explicación: *el suicidio no es un acto individual, sino un fenómeno social*
- Predicción: en sociedades con *baja cohesión social (anomia), aumentarán los suicidios*
- Probabilidad: no todos los individuos en situación de anomia se suicidarán, pero *la probabilidad será mayor*
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### "El Suicidio" E. Durkheim (III) 🚢 👨‍✈

- Ejemplos de múltiples hipótesis
	- Hipótesis 1: Los católicos tienen menor tasa de suicidio que los protestantes
	- Hipótesis 2: Los hombres solteros se suicidan más que los casados
	- Hipótesis 3: La integración familiar reduce el riesgo de suicidios
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->

- **Deducción**🔻: De lo general a lo particular. De la teoría a hipótesis específicas
- **Operacionalización** 📏 : Convertir conceptos en variables medibles. Precisión 
- **Interpretación** 🤔 : Análisis de los datos recolectados, identificación de regularidades. 
- **Inducción** 🔺: De lo particular a lo general. Extracción de conclusiones generales a partir de lo observado.

## Extracto

> Los dos proyectos que he indicado (un vocabulario infinito para serie natural de los números, un inútil catálogo mental de todas las imágenes del recuerdo) son insensatos, pero revelan cierta balbuciente grandeza. Nos dejan vislumbrar o inferir el vertiginoso mundo de Funes. Éste, no lo olvidemos, era casi incapaz de ideas generales, platónicas. No sólo le costaba comprender que el símbolo genérico _perro_ abarcara tantos individuos dispares de diversos tamaños y diversa forma; le molestaba que el perro de las tres y catorce (visto de perfil) tuviera el mismo nombre que el perro de las tres y cuarto (visto de frente). Su propia cara en el espejo, sus propias manos, lo sorprendían cada vez.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->

(continúa)

> (…) Funes discernía continuamente los tranquilos avances de la corrupción, de las caries, de la fatiga. Notaba los progresos de la muerte, de la humedad. Era el solitario y lúcido espectador de un mundo multiforme, instantáneo y casi intolerablemente preciso. Babilonia, Londres y Nueva York han abrumado con feroz esplendor la imaginación de los hombres; nadie, en sus torres populosas o en sus avenidas urgentes, ha sentido el calor y la presión de una realidad tan infatigable como la que día y noche convergía sobre el infeliz Ireneo, en su pobre arrabal sudamericano.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

(continúa)

> Le era muy difícil dormir. Dormir es distraerse del mundo; Funes, de espaldas en el catre, en la sombra, se figuraba cada grieta y cada moldura de las casas precisas que lo rodeaban. (Repito que el menos importante de sus recuerdos era más minucios y más vivo que nuestra percepción de un goce físico o de un tormento físico.) Hacia el Este, en un trecho no amanzanado, había casas nuevas, desconocidas. Funes las imaginaba negras, compactas, hechas de tiniebla homogénea; en esa dirección volvía la cara para dormir. También solía imaginarse en el fondo del río, mecido y anulado por la corriente.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## ¿Cómo es su memoria? 🕸

- Su memoria es **secuencial**
    
- No hay **acceso motivado** a partes de su memoria (o la realidad)
    
- Un recuerdo llama a otro: la información se conecta fractalmente (similitud infinita de patrones similares)
    
- **Individualidad total**: no hay generalizaciones ni escalas
    
- No hay técnicas, no hay prácticas ni situación histórica: no se crea continuidad ni utilidad
    
- El pasado se asume constante y estático.
    

Ref: Bowker, G. C. (2008). _Memory practices in the sciences_ (1. paperback ed). MIT Press.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## ¿Por qué elegimos conceptos? 📚

- Tomamos decisiones sobre **qué priorizamos** y **cómo vamos a entenderlo**
    
- Nos permiten nombrar/construir nuestros **objetos de investigación** (hechos como cosas)
    
- Nos permiten hacer generalizaciones
    
- Eficiencia: evitamos reinventar la rueda
    
- En nuestros problemas de investigación tenemos que hacer dos cosas:
    
    1. Conocer la tradición que ha investigado lo que nos interesa y _como lo ha nombrado_ (comunidad epistémica, continuidad e historia)
        
    2. Comprender la novedad y la relación con los estudios previos (utilidad y relevancia)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Revisión Bibliográfica 📖

- Permite familiarizarse con el tema y cómo se lo ha abordado
    
- Saber qué aspectos se han estudiado (y cuáles permanecen sin estudio)
    
- Conectar nuestro trabajo con trabajos previos: darle contexto en una perspectiva teórica y metodológica (tradición, comunidad)
    
- No repetir errores.
    
- No ser redundantes.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Cómo empezar una revisión bibliográfica 🔎

1. Textos introductorios / revisiones / manuales
    
2. Textos clásicos sobre un tema
    
3. Entrevistas a expertos
    
4. Divulgaciones científicas
    

Consejo: entender el rol de los materiales en la comunidad científica que nos interesa.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Operacionalización ▶

Con nuestro objeto de estudio delimitado. La operacionalización es:

1. Teórico-analítica: conceptos, categorías y variables.
    
2. Poblacional: población/universo, delimitación temporal, delimitación espacial
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Variables 📊

- Elementos contenidos en las hipótesis
    
- Representaciones de características o propiedades a analizar
    
- Pueden ser dependientes e independientes.
    
- Se traducen en dimensiones e indicadores medibles que permitan comprobar la asociación propuesta en las hipótesis.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Hipótesis 🤔

1. Las hipótesis se expresan como proposiciones que afirman o niegan la asociación entre al menos dos variables (dependiente e independiente) en una situación determinada.
    
2. Los conceptos contenidos en las hipótesis deben operacionalizarse: traducirse en dimensiones e indicadores que permitan su medición.
    
3. La elección de la población de estudio tiene implicaciones significativas en el contenido de la investigación y en sus costes económicos y de tiempo.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Diseño de Investigación 📐 📝

- Se desprende de las decisiones de operacoinalización (conceptos, variables, categorías; población, marco temporal, espacial)
    
- Estrategia para alcanzar los objetivos
    
- Delimitada por:
    
    1. El tipo de objeto de estudio (exploratorios, explicativos, predictivos, evaluativos)
        
    2. Los recursos disponibles
        
    3. El plazo de tiempo
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Estrategias posibles 

- Define las técnicas de recolección de información
    
- Define el diseño muestral (tamaño, procedimiento y criterio de selección).
    
- Estrategias:
    
    - Investigación no reactiva,
        
    - estudio de casos,
        
    - encuesta o
        
    - experimento
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Factibilidad de la Información 💾

- El proyecto debe exponer cómo espera que la investigación será viable (condiciones mínimas, fuentes bibliográficas teórica, empírica y metodológicas)
    
- Recursos humanos y materiales (destacando experiencia en el tema)
    
- Equipo y material, desplazamiento, etc. ($)
    
- Planificación temporal: tareas, duración, secuencia, responsables y plazos.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

Para el jueves, necesitamos:

1. Grupos constituídos
    
2. Temas de invesgiación
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# Modulo 1 - Clase 5

1. Tipologías de diseños de investigación
    1. Objetivos
    2. Variable tiempo
    3. Contexto de observación
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Tipos de diseño de investigación 🏷

En un ejemplo de categorización, podemos clasificar los diseños de investigación en torno a tres dimensiones:

1. Los **objetivos** que tiene el estudio (el principal, puede haber varios)
    
2. Cómo se incorpora la _variable tiempo_**_,_** en un **marco temporal**
    
3. Cuál es el **contexto** de la observación de nuestro objeto de estudio
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

| CRITERIO DE CLASIFICACIÓN              | DISEÑO DE INVESTIGACIÓN                                                                                                                                                                                                               |
| -------------------------------------- | ------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
| _Objetivos de la investigación_        | 1. Exploratorios,<br>    <br>2. Descriptivos,<br>    <br>3. Explicativos,<br>    <br>4. Predictivos,<br>    <br>5. Evaluativos (de impacto, del proceso, de necesidades, mediante análisis de sistemas, coste-beneficio, de conjunto) |
| _Tratamiento de la variable de tiempo_ | 1. Seccionales o transversales,<br>    <br>2. Longitudinales (de tendencias, de cohorte, panel)                                                                                                                                       |
| _Contexto_ en el que se observa        | 1. Preexperimentales o correlacionales,<br>    <br>2. Cuasiexperimentales,<br>    <br>3. Experimentales                                                                                                                               |
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Diseño Exploratorio 🔍 

1. Familiarizarse con el _problema_: identificar aspectos requieren análisis más profundo
    
2. Verificar si es _factible_ la investigación (y que medios hacen falta)
    
3. Comprobar la _estrategia_ adecuada
    

Nota: Suele ser un paso inicial y sus casos no suelen ser representativos (no hay proceso de selección muestral)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Ejemplo: deserción estudiantil 🏫

Una universidad quiere entender porqué está aumentando la deserción estudiantil. En su contexto, no se ha estudiado todavía el tema. Hace entrevistas informales a estudiantes que abandonaron, revisan datos preliminares y consultan con expertos en el tema. En base a esto, evalúan la posibilidad de hacer un abordaje más sistemático y tienen información para elegir el método a utilizar.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Diseño descriptivo ☑

1. Se busca caracterizar el objeto de estudio
    
2. Se hace mediante una, o varias, estrategias de investigación (encuesta, estadísticas o estrategias _no reactivas,_ casos de estudio, etc.)
    
3. Igual que el exploratorio, puede servir para fundamentar una investigación
    
4. Sí puede ser un fin en sí mismo.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Ejemplo: Satisfacción Transporte Público 🚌 

Un municipio quiere conocer el nivel de satisfacción ciudadana con el transporte público. Para ello, realiza una encuesta a una muestra representativa de usuarios, recopila estadísticas de uso (frecuencia, rutas más demandadas, tiempos de espera) y revisa documentos como quejas y sugerencias registradas.

Con toda esta información, logra <mark>caracterizar la situación actual del servicio: quiénes lo usan, con qué frecuencia, qué valoran y qué critican.</mark>

Este estudio descriptivo puede servir como base para un estudio màs profunda que busque explicar las causas de la insatisfacción.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Diseño explicativo 

- Identifica **causas o razones** detrás de los hechos, acciones, opiniones o fenómenos analizados.
    
- Busca profundizar en el **porqué** del fenómeno (luego de describirlo, lo explica)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Ejemplo: Migración 🧳

- Tras describir las cifras de inmigración (número y perfil de inmigrantes extranjeros) con datos estadísticos, se diseña una encuesta en una muestra representativa de la población extranjera para conocer las **causas** que motivan la inmigración al país.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Diseño Predictivo

1. Su objetivo es **predecir** la evolución futura del fenómeno analizado.
    
2. La predicción es un fin en sí mismo: anticipar un fenómeno, estimando las probabilidades de que suceda (analizando datos, patrones, tendencias con métodos estadísticos)
    
3. Siempre es probabilístico en rangos (los fenómenos sociales son influídos por múltiples variables)
    
4. Implica también objetivos previos como la **descripción** y **explicación** del fenómeno.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Ejemplo: Club de Fútbol ⚽

Un club quiere tomar decisiones sobre renovaciones de contratos. Quiere predecir el **rendimiento** de sus jugadores en la próxima temporada.

1. Recopila datos (estadísticas individuales: goles, asistencias, lesiones, minutos jugados, etc.), y métricas sobre la condición física y edad de cada jugador. **Describe.**
    
2. Identifica los factores que más influyen en el rendimiento (goles, asistencias, minutos jugados). Identifica que variables como la carga de entrenamientos, historial de lesiones, edad y adaptación táctica son determinantes. **Explica.**
    
3. Busca patrones y tendencias en el rendimiento de los últimos 5 años. **Análisis estadístico.**
    
4. Observa que un delantero de 29 años con historial de lesiones musculares tiene entre un 60% y 70% de probabilidad de reducir su rendimiento goleador en un 20%, mientras que un jugador joven de 22 años tiene entre un 75% y 85% de probabilidad de mejorar sus cifras. **Predice.**
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Diseño Evaluativo 

- Evalúa **efectividad** de un conjunto de medidas o un programa (gobierno, empresa, organización, etc.)
    
- Evaluar es **emitir juicios** basados en información sistemática
    
- Debe controlar el contexto para saber cómo el programa evaluado impacta realmente (y qué es resultado de otros procesos)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## **Modalidades de Evaluación**

- **De impacto:** Analiza los efectos del programa para su mejora. Requiere definir criterios de éxito, diferenciar resultados propios del programa y especificar condiciones de mayor eficacia.
    
- **De proceso (formativa):** Describe en qué consiste el programa y cómo funciona en teoría y práctica. Permite conocer las causas de su éxito o fracaso.
    
- **De necesidades:** Identifica las necesidades prioritarias que el programa debe atender.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## **Modalidades de Evaluación**

- **Análisis de sistemas:** El programa se ve como un conjunto de subsistemas (personal, dirección, gerencia) relacionados entre sí y con sistemas más amplios (familia, comunidad).
    
- **Coste-beneficio:** Compara los costes del programa con sus resultados en términos monetarios. 
    
- **De conjunto:** Integra metas, repercusión, alternativas y costes. Es la síntesis de todas las modalidades anteriores.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

# Tiempo ⏳

1. Cómo se recoge la información
    
2. Cómo se observa el fenómeno a lo largo del tiempo
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Diseños seccionales o trasversales 

1. Se recoge información en un **único momento en el tiempo**
    
2. Son estudios, generalmente:
    
    1. Descriptivos (caracteriza una población en un momento concreto)
        
    2. Explicativos (qué variables inciden en la ocurrencia de un fenómeno)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Ejemplo 🇪‍🇺

> Una encuesta realizada (al mismo tiempo) en los distintos países de la Unión Europea para conocer las actitudes de los europeos ante las minorías étnicas. **El estudio sería longitudinal si la misma encuesta se aplicara en diferentes años para analizar la evolución de las actitudes a lo largo del tiempo**. (Cea D'Ancona, 2012, p. 55)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## **Diseños Longitudinales**

- Recogen datos en **distintos momentos temporales** para analizar la dinámica de un fenómeno.
    
- Las fechas de recogida se definen en el proyecto de investigación según los **objetivos del estudio**.
    
- Se distinguen tres tipos: de tendencias, de cohorte y de panel.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## **Diseño Longitudinal de Tendencias**

- Analiza la **evolución de una población** en distintos momentos del tiempo (datos estadísticos o demoscópicos)
    
- Los **sujetos cambian** en cada medición, pero se mantiene el mismo diseño.
    
    **Ejemplo:** Se realiza cada año desde 2008 una encuesta con el mismo diseño muestral para analizar la evolución del racismo y la xenofobia en España, pero encuesta a personas diferentes cada año.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## **Diseño Longitudinal de Cohorte**

- El interés no está en la población total, sino en una **subpoblación o cohorte** (individuos que comparten una característica: edad, año de graduación, experiencia concreta, etc.).
    
- Se selecciona una **muestra distinta** de la cohorte en cada fecha de recogida.
    
- Pueden compararse **cohortes diferentes** para analizar efectos distintos.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Ejemplo 🏫

1. Se desea conocer la trayectoria laboral de los licenciados en sociología.
    
2. La cohorte fijada la componen los licenciados en universidades públicas y privadas en España en 2009.
    
3. Cada dos años se extrae una muestra de entre los licenciados en dicha fecha.
    
4. Si la cohorte se fija en la edad de 30 años, cada dos años se extraerá una muestra de entre los licenciados que tengan 30 años.
    
    A diferencia del supuesto anterior, la edad permanece estable; en el anterior la edad aumenta cada dos años (con la consiguiente merma en la base muestral).
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## **Diseño Longitudinal de Panel**

- Se analizan los **mismos individuos** a lo largo del tiempo (no se hacen nuevas selecciones muestrales).
    
- Es muy útil para investigar las **causas del cambio**, ya que las personas son las mismas y lo que varía son sus circunstancias.
    
    **Ejemplo:** Pasar la misma encuesta a la misma muestra de licenciados en sociología cada dos años para seguir su trayectoria individual
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## **Problemas del Diseño de Panel**

- **Desgaste de la muestra:** Los participantes abandonan con el tiempo (rechazo, cambio de domicilio, fallecimiento), reduciendo el tamaño muestral e introduciendo posibles sesgos.
    
- **Sesgo por aprendizaje:** Realizar varias mediciones a las mismas personas puede alterar sus respuestas (especialmente si las fechas de recogida son cercanas).
    
- **Mayores costos:** común a todos los diseños longitudinales, aumenta con el tamaño de la muestra y su dispersión geográfica.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## **Alternativa: Estudios Retrospectivos (Diseño Transversal)**

- Los diseños transversales también permiten analizar el cambio a **menor coste**, incluyendo preguntas sobre el pasado en el cuestionario.
    
- **Limitación principal:** La fiabilidad de la **memoria** del encuestado, que disminuye cuanto mayor es el tiempo transcurrido y menor relevancia tiene el tema.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Ejemplo: Diseño Longitudinal de Panel 🗳

1. **Estudio:** _The People's Choice_ (Lazarsfeld, Berelson y Gaudet, 1944).
    
2. **Objetivo:** Analizar el efecto de la campaña electoral en la intención de voto durante las elecciones presidenciales de EE.UU. en 1940 (Wilkie vs. Roosevelt).
    
3. **Método:** Se aplicó el mismo cuestionario **3 veces** (mayo a noviembre) a la **misma muestra de 600 electores** del condado de Erie, Ohio.
    
4. **Innovación:** Para controlar el sesgo por mediciones repetidas, en cada fase también se encuestó a una **muestra alternativa diferente** (grupo de control) con el mismo perfil sociodemográfico.
    
5. **Resultado:** Este diseño permitió distinguir si los cambios en la intención de voto se debían realmente a la campaña electoral o a efectos de la aplicación repetida del cuestionario.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->

## ¿Qué son los datos "no reactivos"?

- Son medios que no intrusivos:

## Observación en entornos naturales
> “El análisis se circunscribe a lo **observado** en **entornos naturales (ajenos a la manipulación experimental)**, a lo que queda registrado sin conocimiento de que se es objeto de estudio. La información se infiere a partir de los datos disponibles.” (Cea D'Ancona, 2012, p. 157)

## Sin efectos en la observación

> “La ventaja principal de la investigación no intrusiva (o reactiva) es que mide **la conducta “real” como opuesta a la “autoinformada”** (a lo que se dice que se piensa o hace a través de entrevista, cuestionario, grupo de discusión...). Y sobre todo su bajo coste económico-temporal. En su contra, que la observación de la conducta “real” no necesariamente es unívoca.” (Cea D'Ancona, 2012, p. 158)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->

## Ejemplo 3: Mujeres que son o fueron presidentas 🤵‍♀ 

https://w.wiki/HytC

- `?women wdt:P31 wd:Q5` — la persona debe ser una instancia de ser humano (Q5).
- `?women wdt:P21 wd:Q6581072` — su género debe ser femenino (Q6581072).
- `?women wdt:P39 ?position` — debe tener un cargo (P39) registrado, que se guarda en la variable ?position.
- `?position wdt:P279* wd:Q30461` — ese cargo debe ser una subclase de "presidente" (Q30461). El asterisco `*` permite recorrer múltiples niveles de subclases, por lo que captura cargos como "Presidenta de Francia", "Presidenta de Brasil", etc.
- `?position wdt:P1001 ?jurisdiction` — el cargo debe estar vinculado a una jurisdicción concreta mediante la propiedad P1001 ("aplica a la jurisdicción").
- `?jurisdiction wdt:P31 wd:Q3624078` — esa jurisdicción debe ser una instancia de estado soberano (Q3624078), lo que excluye universidades, empresas u otras organizaciones.
- `FILTER NOT EXISTS { ?women wdt:P570 ?death }` — excluye a cualquier persona que tenga registrada una fecha de fallecimiento (P570), quedándonos solo con personas vivas.

4. **Mapeo de Fuentes Secundarias**: Evaluación de la calidad y pertinencia de archivos y bases de datos existentes, diseño de fichas metodológicas y una propuesta para el uso analítico de los materiales consultados.
    

Otros (a sugerencia de la clase).
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->

## Modulo 3 📂
## La encuesta como estrategia de investigación 🗒
### Clase 10
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Encuestas como técnica de recopilación de datos

- Permite **escalar** el estudio de fenómenos sociales de forma **sistemática** y **replicable**
	- Sistemática: procedimiento que se hace explicito, orientado y ordenado a un proyecto de investigación, que se hace de forma constante-sostenida.
	- Replicable: el instrumento puede ser aplicado y verificado
- Compara respuestas y generaliza resultados
- Requiere decisión, diseño y testeo
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Reducción de la "complejidad”:

- La sistematicidad permite controlar el "azar" y comprender lo que parece caos. 
- Encuestas sociales (S XIX / XX): cuestionario estandarizado **aspectos objetivos** (hechos soc. como cosas)
    - Condiciones de vida    
    - Vivienda
    - Escolarización
    - Hábitos de higiene y salud
- La información se obtiene mediante **observación indirecta**: las respuestas de los encuestados _representan_ la realidad, no la reproducen fielmente

Ver **Cea D'Ancona (2012,  186-188)**
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Estandarización 📐

- *Formulación*: las preguntas deben darse en **iguales términos** y en el **mismo orden** a todos los encuestados
- Permite **comparar** respuestas entre individuos y poblaciones
- Si median entrevistadores o dispositivos, deben seguir el **mismo procedimiento** (o controlar impactos) en cada caso
- Las diferencias en las respuestas deben reflejar **diferencias reales** entre encuestados, no variaciones en la aplicación de la encuesta (sesgos)
- El incumplimiento de la estandarización introduce **errores de medición** (ruido o sesgos)

Cea D'Ancona (2012, p. 200)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Representatividad 🪞

- La muestra debe ser **representativa** de la población o universo de estudio (definido por el investigador, en base a teoría/hipotesis)
- El interés del investigador va *más allá del individuo*: busca **generalizar** hacia la población
- La información debe tener correspondencia con los valores **"verdaderos"** (obtenidos de TODA la población)
- Una muestra representativa aumenta:
    - La **validez externa**: posibilidad de generalizar los resultados
    - La **conclusión estadística**: significatividad estadística de los resultados
- Depende del **tamaño de la muestra** y del **procedimiento de selección** de las unidades
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## ¿Qué podemos (y no podemos) preguntar? 💬 ❔

_discutamos:_

> ¿Qué tipo de preguntas se pueden responder con una encuesta? ¿Y cuáles no?

- Piensen en su  objeto de investigación y su proyecto
- ¿Qué aspectos de su tema serían **medibles** con una encuesta?
- ¿Qué quedaría **fuera**?
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Posibilidades 

- Permite estudiar un **amplio abanico de cuestiones**: tanto aspectos objetivos (hechos) como subjetivos (opiniones, actitudes, valores)
- Accede a lo **no directamente observable**: lo que las personas piensan, sienten o viven
- La estandarización permite **comparar** respuestas entre individuos y poblaciones
- Permite **generalización** de resultados a poblaciones más amplias
- Permite **agrupar** individuos en base a las respuestas
- Puede combinarse con otras técnicas para **triangular** información

Cea D'Ancona (2012, p. 199)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Muestra pequeña, grandes resultados 🗳

- En 1936, la revista _The Literary Digest_ realizó una **macroencuesta por correo** a miles de suscriptores para predecir las elecciones presidenciales de EE.UU.
- Su lógica: _a mayor número de encuestados, mejor la predicción_
	- **Fracasó** ❌
- **Gallup y Crossley**, con solo **1.500 votantes elegidos al azar** con cuotas por edad y sexo, predijeron correctamente la victoria de Roosevelt
- La lección: una muestra **pequeña pero bien seleccionada** refleja mejor la realidad que una muestra grande con sesgos de cobertura

_Cea D'Ancona (2012, p. 192)_
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Errores en la encuesta 🔍

Ninguna encuesta está libre de errores. Se agrupan en dos grandes categorías:

**Errores de no observación** — afectan la _representatividad_

- **Cobertura**: el marco muestral no incluye a todos los integrantes de la población
- **Muestreo**: no todas las unidades tuvieron igual probabilidad de ser seleccionadas
- **No respuesta**: hay unidades de la muestra de las que no se obtuvo información

**Errores de observación o medición** — afectan la _calidad de los datos_

- Se producen durante la recopilación misma de la información
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## De los errores a los datos 🔀

- Los errores de encuesta nos recuerdan que los datos no son neutros: son el resultado de **decisiones metodológicas**
- Qué preguntamos, a quién y cómo condiciona **qué tipo de información** producimos
- Esto nos lleva a una pregunta clave: <mark>¿qué tipo de datos produce una encuesta?</mark>
- La respuesta depende, en gran medida, del tipo de **variables** que utilizamos
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## ¿Qué es una variable? 📐 📏

- Una variable es una **característica o atributo** de las unidades de análisis que puede tomar distintos valores
- En una encuesta, cada pregunta opera como una variable
- Las variables no son neutrales: reflejan **decisiones conceptuales** sobre cómo entender y medir la realidad
- Distinguir tipos de variables es clave para saber qué análisis estadísticos son posibles
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## ¿Qué tipo de dato es este? 🤔 ❔

_En grupos, piensen en su objeto de investigación y formulen **tres preguntas** que le harían a un encuestado. Luego discutan:_

- ¿Cómo describirían el tipo de información que produce cada pregunta?
- ¿Es algo **observable directamente** o es una **opinión o percepción**?
- ¿La respuesta sería un número, una categoría o una escala?

> El objetivo no es tener la respuesta correcta, sino empezar a notar que **no todas las preguntas producen el mismo tipo de datos**
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Tipología de variables: nivel de medición 📊

|Tipo|Características|Ejemplo|
|---|---|---|
|**Nominales**|Categorías sin orden|Sexo, nacionalidad|
|**Ordinales**|Categorías con orden, sin distancia fija|Nivel educativo, acuerdo/desacuerdo|
|**De intervalo**|Distancia fija, sin cero absoluto|Temperatura, año|
|**De razón**|Distancia fija, con cero absoluto|Ingresos, edad|
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Tipología de variables: desde la producción de datos 

- **Variables de hecho**: registran comportamientos o situaciones objetivas — _¿Cuántas horas trabaja por semana?_
- **Variables de opinión**: capturan actitudes, valoraciones o percepciones — _¿Qué tan satisfecho está con su trabajo?_
- **Variables de conocimiento**: indagan sobre lo que el encuestado sabe — _¿Conoce usted sus derechos laborales?_
- La distinción importa porque cada tipo exige **decisiones distintas** en el diseño del cuestionario y en la interpretación de los resultados
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Comentarios finales 

- La encuesta es una técnica poderosa, pero no infalible
- Su calidad depende de decisiones en **cada etapa**: diseño, muestreo, aplicación y análisis
- Los tipos de variables condicionan **qué podemos preguntar** y **qué podemos concluir**
- Toda encuesta es, en última instancia, una forma de **reducir la complejidad** de la realidad social — con todas las implicancias que eso conlleva
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-dark-background drop" data-background-color="#1C7C54" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Fases esenciales de la encuesta 🗺️ 

<img src="Slides 🧰 🛠️/TRDC_UAM-A_26-I/FASES_Encuesta.png" alt="" style="object-fit: scale-down">
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Elaboración de un cuestionario 📝

Tipos de error a evitar:

- **Especificación**: la pregunta no se adecua a los objetivos, no se corresponde con el concepto que se quiere medir
- **Medición por vocabulario**: palabras ambiguas o con distintas connotaciones, error por desigual interpretación de términos de la pregunta
- **Medición por redacción**: error por como es introducida y/o formulada la pregunta,
- **Medición por opciones de respuesta**: se afectan las respuestas por el órden, las alternativas se presentan desequilibradas o que inducen respuesta

 <mark>Varios errores de medición pueden reducirse con un buen diseño de cuestionario</mark>
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Cómo reducir los errores 🔧

> "Varios de los errores de medición (o respuesta) pueden reducirse con un buen diseño de cuestionario."

**a)** Especificar los objetivos de la encuesta y la información que pretende recogerse.

**b)** Identificar los conceptos centrales en la investigación y traducirlos en indicadores "válidos", que ayuden a reducir los errores de especificación:

- Diferenciar lo que el concepto _incluye_ y _excluye_
- Describir su opuesto: tolerancia–intolerancia, xenofobia–xenofilia, discriminación–integración
- Descomponer el concepto en dimensiones → buscar indicadores para cada una
- Preferible acotar dimensiones y aumentar indicadores (aumenta la validez de constructo)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Cómo reducir los errores 🔧

**c)** Elegir el método de encuesta y concretar la población. Como regla: utilizar palabras comprendidas por aquellos de menor nivel de formación en la población de estudio.

**d)** Concretar los análisis que se prevé realizar, en consonancia con los objetivos de la investigación.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## La redacción de las preguntas 💬

### ¿Qué es una "buena" pregunta?

> _"Aquella que no afecta a la respuesta"_ — Payne (1980: 72)

> _"No existe ninguna pregunta de encuesta puramente objetiva"_ — Hox (1997: 53)

La búsqueda de la objetividad se convierte en una **meta** al ser un requisito de calidad de la pregunta, pero siempre hay limitaciones. Buscamos **optimizar** la formulación, siguiendo **buenas prácticas y recomendaciones.**
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Recomendaciones para redactar preguntas 📝

- Formular preguntas **relevantes** para la investigación
- **Breves** y fáciles de comprender por las personas a las que van dirigidas
- Vocabulario **sencillo**, evitando conceptos o términos abstractos. 
  *Ej: "dolor de cabeza" en lugar de "cefaleas"*
- Redacción **precisa**: cuantos más detalles aporte, más facilita su comprensión e interpretación
- Lo más **objetiva o neutra** posible para no influir en la respuesta
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Recomendaciones para redactar preguntas 📝
- **Sin negaciones**: dificultan la comprensión, especialmente cuando se pide un grado de acuerdo o desacuerdo (p. ej., ¿No le parece que...?).
- De forma **personal y directa**: las preguntas específicas dan información más precisa que las genéricas
- **Principio de la idea única**: ni las preguntas ni las alternativas pueden referirse a varias cuestiones al mismo tiempo
- Sin palabras que comporten una **reacción estereotipada**

Fowler (1998): no utilizar escalas con adjetivos para medir estados subjetivos en estudios internacionales o con poblaciones de culturas diversas.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## El formato de la pregunta 📄

> "La pregunta puede figurar en el cuestionario con un formato abierto o cerrado, dependiendo de si aparecen expresas las alternativas de respuesta."

**Preguntas abiertas**: el encuestado puede expresarse con sus propias palabras, no circunscribiendo su respuesta a una alternativa predeterminada. Ej: _"¿Qué piensa sobre...?"_, _"¿Por qué?"_
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Preguntas abiertas: ventajas 💪

- Más fáciles de elaborar: no exigen mucho conocimiento previo sobre lo que se pregunta
- Ocupan menos espacio en el cuestionario
- Permiten al encuestado responder con sus propias palabras, sin sugerirle ningún tipo de respuesta
- Pueden obtenerse respuestas no previstas o inesperadas al diseñar el cuestionario
- Permiten captar lo más _saliente_ para el encuestado: lo primero que le viene a la mente
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Preguntas abiertas: inconvenientes 

> _"Pocas personas emplean las mismas palabras incluso para expresar la misma idea. Algunos clarifican sus afirmaciones mejor que otros. Esto hace la grabación difícil cuando queremos distinguir entre dos ideas estrechamente relacionadas pero aun así diferentes."_ — Payne (1980: 53-54)

- **Más caras**: mayor esfuerzo en registro, transcripción y codificación
- Más expuestas a **errores de registro** y de traducción de la información; mayor subjetividad en su interpretación
- La respuesta exige **más tiempo y esfuerzo** por parte del encuestado → su uso se desaconseja en cuestionarios autoadministrados (Dillman, 1978)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## ¿Qué es una escala? 📉📈

> "La escala dispone las respuestas u observaciones en un continuo, permitiendo captar la intensidad, la dirección y el nivel del constructo que se mide."

- Puede utilizar un único o varios indicadores
- Lo habitual es que agrupe **múltiples indicadores**
- En un nivel de medición **ordinal**
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Tipos de escala 📏

1. Escala de **distancia social** de Bogardus 🧭 (proximidad)
2. Escala **diferencial** de Thurstone ⚖️ (posición en un continuo)
3. Escala **acumulativa** de Guttman 🔢 (acumulación)
4. Escala **aditiva** de Likert ➕ (intensidad de acuerdos)
5. Diferencial **semántico** de Osgood  🔀 (percepción)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 1200px; width: 1800px; min-height: 1200px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Escala de distancia social de Bogardus 🧭

Se usa para:
- Medir la voluntad de miembros de grupos étnicos diferentes de relacionarse con otros ('distancia social')
- Medir lo próximo o distante que una persona se siente de cualquier otro grupo de población (de diferente etnia, cultura, religión, delincuentes, homosexuales, portantes del VIH...).
- Escala acumulativa: el acuerdo con un ítem implica el acuerdo con los ítems precedentes
- Soporta un índice de distancia social (en base al peso de cada punto de la escala)

> "Una serie de proposiciones se ponen en **orden decreciente**, de mayor a menor deseo de interrelación con un grupo de población diferencial, expuesto a estigmas y prejuicios sociales." (Cea D'Ancona, 2012, p. 93)

Ver en Cea D'Ancona (2012, p. 93-95)
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->

|Proposición|Sí|No|
|---|---|---|
|Admitiría a un miembro de este grupo como familiar cercano|1|0|
|Lo admitiría como amigo personal|1|0|
|Lo admitiría como vecino en mi barrio|1|0|

|Lo admitiría como ciudadano de mi país|1|0|
|Solo lo admitiría como turista|1|0|
|Lo excluiría de mi país|1|0|
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="has-light-background drop" template="" data-background-color="#F2E7BF" -->
